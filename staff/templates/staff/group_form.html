{% extends "staff/base_staff.html" %}
{% block title %}{% if is_new %}New Group{% else %}Edit Group{% endif %}{% endblock %}
{% block staff_content %}
    {% if is_new %}
        <h2>New Group</h2>
    {% else %}
        <p><a href="{% url 'staff_group_detail' group.id %}">&larr; Back to {{ group }}</a></p>
        <h2>Edit {{ group }}</h2>
    {% endif %}
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if is_new %}Create Group{% else %}Save Changes{% endif %}</button>
        </form>
    </div>
{% endblock %}
