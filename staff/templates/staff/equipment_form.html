{% extends "staff/base_staff.html" %}
{% block title %}{% if is_new %}Add Equipment{% else %}Edit Equipment{% endif %}{% endblock %}
{% block staff_content %}
    <p><a href="{% url 'staff_equipment_list' %}">&larr; Back to equipment</a></p>
    <h2>{% if is_new %}Add Equipment{% else %}Edit {{ item.name }}{% endif %}</h2>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if is_new %}Add Equipment{% else %}Save Changes{% endif %}</button>
        </form>
    </div>
{% endblock %}
