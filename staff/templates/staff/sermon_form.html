{% extends "staff/base_staff.html" %}
{% block title %}{% if is_new %}New Sermon{% else %}Edit Sermon{% endif %}{% endblock %}
{% block staff_content %}
    <p><a href="{% url 'staff_sermon_list' %}">&larr; Back to sermons</a></p>
    <h2>{% if is_new %}New Sermon{% else %}Edit {{ sermon.title }}{% endif %}</h2>
    <div class="card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if is_new %}Post Sermon{% else %}Save Changes{% endif %}</button>
        </form>
    </div>
{% endblock %}
