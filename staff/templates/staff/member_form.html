{% extends "staff/base_staff.html" %}
{% block title %}{% if is_new %}Add Member{% else %}Edit Member{% endif %}{% endblock %}
{% block staff_content %}
    {% if is_new %}
        <h2>Add Member</h2>
    {% else %}
        <p><a href="{% url 'staff_member_detail' member.id %}">&larr; Back to {{ member }}</a></p>
        <h2>Edit {{ member }}</h2>
    {% endif %}
    <div class="card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if is_new %}Add Member{% else %}Save Changes{% endif %}</button>
        </form>
    </div>
{% endblock %}
