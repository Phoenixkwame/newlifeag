{% extends "staff/base_staff.html" %}
{% block title %}{% if is_new %}New Survey{% else %}Edit Survey{% endif %}{% endblock %}
{% block staff_content %}
    <p><a href="{% url 'staff_survey_list' %}">&larr; Back to surveys</a></p>
    <h2>{% if is_new %}New Survey{% else %}Edit {{ survey.title }}{% endif %}</h2>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if is_new %}Create Survey{% else %}Save Changes{% endif %}</button>
        </form>
    </div>
{% endblock %}
