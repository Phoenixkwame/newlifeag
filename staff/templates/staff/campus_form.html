{% extends "staff/base_staff.html" %}
{% block title %}{% if is_new %}Add Campus{% else %}Edit Campus{% endif %}{% endblock %}
{% block staff_content %}
    {% if is_new %}
        <h2>Add Campus</h2>
    {% else %}
        <p><a href="{% url 'staff_campus_detail' campus.id %}">&larr; Back to {{ campus }}</a></p>
        <h2>Edit {{ campus }}</h2>
    {% endif %}
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if is_new %}Add Campus{% else %}Save Changes{% endif %}</button>
        </form>
    </div>
{% endblock %}
