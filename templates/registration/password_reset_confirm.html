{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block content %}
    <h1>Set a new password</h1>
    {% if validlink %}
        <div class="card">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Change password</button>
            </form>
        </div>
    {% else %}
        <p>
            This password reset link is invalid or has expired.
            <a href="{% url 'password_reset' %}">Request a new one</a>.
        </p>
    {% endif %}
{% endblock %}
