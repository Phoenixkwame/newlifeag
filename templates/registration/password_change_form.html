{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
    <p><a href="{% url 'account_settings' %}">&larr; Back to account settings</a></p>
    <h1>Change your password</h1>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change password</button>
        </form>
    </div>
{% endblock %}
