{% extends "base.html" %}
{% block title %}I'm New Here{% endblock %}
{% block content %}

        <h1>We're glad you're here</h1>
        <p>Tell us a little about yourself so we can follow up and help you get connected at Newlife AG.</p>
    </div>

            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit</button>
        </form>
    </div>
{% endblock %}
